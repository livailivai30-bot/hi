<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Story Forge — حالات الشخصيات</title></head><body><header class="topbar"><div><div class="eyebrow">CHARACTER STATE</div><h1>تطور الشخصية عبر الزمن</h1></div><a class="primary" href="index.html">← غرفة القصة</a></header><main><section class="hero"><div><div class="eyebrow">STATE TRACKER</div><h2>تتبّع حالة الشخصية في كل مرحلة.</h2><div class="muted">سجل الحالة النفسية والجسدية والموقع والقدرات في فصل أو حدث محدد.</div></div></section><section class="card editor"><div class="two"><label>الشخصية<select id="character"></select></label><label>الفصل<input id="chapter" type="number" placeholder="رقم الفصل"></label></div><div class="two"><label>الحدث المرتبط<select id="event"></select></label><label>الحالة<select id="status"><option>active</option><option>injured</option><option>missing</option><option>dead</option><option>changed</option></select></label></div><div class="two"><label>العمر<input id="age" type="number"></label><label>الموقع<select id="location"></select></label></div><div class="two"><label>الحالة النفسية<textarea id="psychology"></textarea></label><label>الإصابات والقدرات<textarea id="body"></textarea></label></div><label>ملاحظات التطور<textarea id="notes"></textarea></label><button id="save" class="save">حفظ الحالة</button></section><section class="card"><div class="row"><b>السجل</b><button id="refresh" class="ghost">تحديث</button></div><div id="list"></div></section></main><script src="core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fill(id,arr,placeholder){$(id).innerHTML=`<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${x.id}">${esc(x.name||x.title||'بدون اسم')}</option>`).join('')}function render(){fill('character',StoryForge.db.characters,'اختر الشخصية');fill('event',StoryForge.db.events,'بدون حدث');fill('location',StoryForge.db.locations,'بدون مكان');const states=StoryForge.db.states;$('list').innerHTML=states.length?states.slice().reverse().map(s=>`<div class="item"><b>${esc(StoryForge.name(s.characterId))}</b> · فصل ${esc(s.chapter||'—')} · ${esc(s.status||'')}<div class="muted">العمر: ${esc(s.age||'—')} · ${esc(StoryForge.name(s.locationId)||'بدون مكان')}</div><div>${esc(s.psychology||s.notes||'')}</div></div>`).join(''):'<div class="empty">لا توجد حالات بعد.</div>'}function save(){const c=$('character').value;if(!c)return alert('اختر الشخصية.');StoryForge.state(c,{chapter:Number($('chapter').value)||null,eventId:$('event').value,status:$('status').value,age:Number($('age').value)||null,locationId:$('location').value,psychology:$('psychology').value,body:$('body').value,notes:$('notes').value});render();alert('تم حفظ الحالة.')}$('save').onclick=save;$('refresh').onclick=render;render();</script></body></html>
