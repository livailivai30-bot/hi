<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Story Forge — Story Structure</title></head><body><header class="topbar"><div><div class="eyebrow">STORY STRUCTURE</div><h1>بنية القصة</h1></div><a class="primary" href="index.html">← غرفة القصة</a></header><main><section class="hero"><div><div class="eyebrow">STORY → ARC → ACT → CHAPTER → SCENE → EVENT</div><h2>شاهد البناء السردي كمجموعة مترابطة.</h2><div class="muted">كل عنصر يقرأ الروابط المخزنة فعليًا في قاعدة البيانات.</div></div></section><div id="root"></div></main><script src="core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let h='';for(const a of StoryForge.db.arcs){const acts=StoryForge.db.acts.filter(x=>x.arcId===a.id);h+=`<section class="card" style="margin-bottom:12px"><h2>⚔️ ${esc(a.name)}</h2><div class="muted">${esc(a.goal||'')}</div>`;for(const act of acts){const ch=StoryForge.db.chapters.filter(x=>x.actId===act.id&&x.arcId===a.id);h+=`<div class="item"><b>🧩 ${esc(act.name)}</b><div class="muted">${esc(act.goal||'')}</div>${ch.map(c=>{const sc=StoryForge.db.scenes.filter(s=>s.chapterId===c.id);return `<div class="item"><b>📖 ف${esc(c.number||'—')} — ${esc(c.name)}</b><div>${esc(c.goal||'')}</div>${sc.map(s=>`<div class="item"><b>🎬 ${esc(s.name)}</b> · ${StoryForge.db.events.filter(e=>e.chapterId===c.id).length} حدث مرتبط</div>`).join('')}</div>`}).join('')||'<div class="muted">لا توجد فصول مرتبطة بهذا الجزء.</div>'}</div>`}h+='</section>'} $('root').innerHTML=h||'<div class="card empty">ابدأ بإضافة آرك ثم جزء وفصل ومشهد.</div>'}render();</script></body></html>
