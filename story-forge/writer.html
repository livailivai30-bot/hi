<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Forge — مساحة الكتابة</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">STORY FORGE · WRITER</div><h1>مساحة الكتابة</h1></div><a class="primary" href="index.html">← العودة إلى الموسوعة</a></header><main class="writer"><section class="hero"><div><div class="eyebrow">WRITING ONLY</div><h2>اكتب القصة مباشرة.</h2><div class="muted">مساحة مخصصة للنص: كتابة، مراجعة، تنظيم، حفظ وتصدير.</div></div></section><section class="card editor"><input id="title" placeholder="عنوان الفصل / المشهد"><div class="two"><input id="chapter" placeholder="رقم الفصل"><input id="location" placeholder="المكان / الزمن"></div><textarea id="draft" spellcheck="true" placeholder="ابدأ الكتابة هنا...\n\nاكتب السرد والحوار والوصف والحركة بحرية."></textarea><div class="actions"><button class="save" id="save">حفظ كفصل</button><button class="ghost" id="saveDraft">حفظ المسودة</button><button class="ghost" id="clear">مسودة جديدة</button><button class="ghost" id="download">تصدير TXT</button></div></section><section class="card"><div class="row"><b>إحصاءات النص</b><span id="saved" class="muted">جاهز</span></div><div class="grid"><div class="item"><span class="muted">الكلمات</span><strong id="words">0</strong></div><div class="item"><span class="muted">الأحرف</span><strong id="chars">0</strong></div><div class="item"><span class="muted">الفقرات</span><strong id="paragraphs">0</strong></div></div></section><section class="card revision"><div class="row"><b>مراجعة النص</b><button class="ghost" id="clearRevision">مسح الملاحظات</button></div><textarea id="revision" placeholder="اكتب ملاحظاتك أثناء المراجعة: جملة تحتاج إعادة صياغة، حوار يحتاج تقوية، ثغرة سردية..."></textarea></section></main><script src="writer.js"></script></body></html>
