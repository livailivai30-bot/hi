<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Story Forge — المساعد السردي</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">STORY FORGE · AI</div><h1>المساعد السردي</h1></div><a class="primary" href="index.html">← العودة</a></header><main class="writer"><section class="card"><div class="eyebrow">STORY CONTEXT</div><h2>مساعد يفهم عالم قصتك</h2><p class="muted">هذه الواجهة مجهزة لربط نموذج ذكاء اصطناعي لاحقًا ببيانات عالمك. لن يتم وضع مفتاح API داخل الموقع.</p><div class="two"><select id="task"><option>تحليل فصل</option><option>فحص الاستمرارية</option><option>تطوير شخصية</option><option>اقتراح تطور سردي</option><option>تنظيم معلومات القصة</option></select><button class="save" id="prepare">تجهيز السياق</button></div></section><section class="card"><div class="row"><b>طلبك للمساعد</b><span id="count" class="muted">0 كلمة</span></div><textarea id="prompt" style="min-height:180px" placeholder="اكتب ما تريد من المساعد... مثال: راجع هذا الفصل وابحث عن تناقضات الشخصية والدوافع."></textarea><button class="save" id="copy">نسخ حزمة السياق</button></section><section class="card"><div class="row"><b>سياق القصة</b><span id="status" class="muted">لم يُجهز بعد</span></div><textarea id="context" readonly style="min-height:280px"></textarea></section></main><script src="ai.js"></script></body></html>
