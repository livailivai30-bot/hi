<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Forge — غرفة عمليات القصة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<main id="main"></main>
</div>
<script src="app.js"></script>

</html>
