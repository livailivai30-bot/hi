<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><title>Story Forge — صحة المشروع</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">STORY FORGE · PROJECT HEALTH</div><h1>صحة المشروع</h1></div><div class="actions"><a class="ghost" href="search.html">🔍 البحث</a><a class="primary" href="index.html">← غرفة القصة</a></div></header><main><section class="hero"><div><div class="eyebrow">STORY AUDIT</div><h2>اختبار جاهزية المنظومة.</h2><div class="muted">فحص محلي للبيانات، الروابط، الاستمرارية، والأسرار. لا يغير شيئًا.</div></div></section><div id="score" class="card"></div><div id="cards" class="grid"></div><h3 class="section-title">المشكلات</h3><div id="issues" class="card"></div><h3 class="section-title">النسخ والتخزين</h3><div id="storage" class="card"></div></main><script src="core.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s=StoryForge.stats(),issues=StoryForge.continuity(),keys=['characters','factions','locations','lore','arcs','acts','chapters','scenes','events','relationships','timeline','foreshadows','mysteries','abilities','powerRules'];const cards=keys.map(k=>`<div class="card"><span class="muted">${StoryForge.labels[k]}</span><div class="stat">${s[k]}</div></div>`);document.getElementById('cards').innerHTML=cards.join('');const checks=[s.characters>0,s.factions+s.locations+s.lore>0,s.arcs>0,s.chapters>0,s.scenes>0,s.events>0,s.relationships>0,s.timeline>0,s.mysteries>0,s.abilities>0,issues.filter(x=>x.level==='error').length===0];const score=Math.round(checks.filter(Boolean).length/checks.length*100);document.getElementById('score').innerHTML=`<div class="row"><b>جاهزية المنظومة</b><strong>${score}%</strong></div><div class="muted">نسبة تشغيلية: اكتمال البنية والربط الأساسي، وليست تقييمًا أدبيًا.</div>`;document.getElementById('issues').innerHTML=issues.length?issues.map(x=>`<div class="item">${x.level==='error'?'⛔':x.level==='warning'?'⚠️':'ℹ️'} ${esc(x.message)}<div class="muted">${(x.entities||[]).map(StoryForge.name).filter(Boolean).map(esc).join(' · ')}</div></div>`).join(''):'<div class="item good">✅ لا توجد مشاكل بنيوية مكتشفة.</div>';const bytes=new Blob([StoryForge.export()]).size;document.getElementById('storage').innerHTML=`<div class="item"><b>قاعدة القصة:</b> ${bytes.toLocaleString()} بايت</div><div class="item"><b>الإصدار:</b> 4</div><div class="item"><b>آخر تحديث:</b> ${new Date(StoryForge.db.updatedAt).toLocaleString('ar')}</div>`;</script></body></html>
