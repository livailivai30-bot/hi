<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Story Forge — صحة المشروع</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">STORY FORGE · PROJECT HEALTH</div><h1>صحة المشروع</h1></div><div class="top-actions"><a class="ghost" href="search.html">🔍 البحث</a><a class="primary" href="index.html">← غرفة القصة</a></div></header><main><section class="hero"><div><div class="eyebrow">STORY AUDIT</div><h2>اعرف ما ينقص قصتك قبل أن يكبر المشروع.</h2><div class="muted">فحص محلي للبيانات المخزنة على هذا الجهاز. لا يغير أي شيء.</div></div></section><div id="score" class="card" style="margin-bottom:14px"></div><div id="cards" class="grid"></div><h3 class="section-title">الأشياء التي تستحق المراجعة</h3><div id="issues" class="card"></div><h3 class="section-title">إحصاءات التخزين</h3><div id="storage" class="card"></div></main><script>const KEY='story-forge-v3',DRAFT='story-forge-draft',REV='story-forge-revision',VERS='story-forge-versions';const d=JSON.parse(localStorage.getItem(KEY)||'null')||{};const arr=k=>Array.isArray(d[k])?d[k]:[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const chars=arr('characters'),world=arr('world'),arcs=arr('arcs'),chapters=arr('chapters'),timeline=arr('timeline'),rels=arr('relationships'),notes=arr('notes');const cards=[['الشخصيات',chars.length],['العالم',world.length],['الآركات',arcs.length],['الفصول',chapters.length],['الأحداث',timeline.length],['العلاقات',rels.length]];document.getElementById('cards').innerHTML=cards.map(([n,v])=>`<div class="card"><span class="muted">${n}</span><div class="stat">${v}</div></div>`).join('');const issues=[];const charNames=chars.map(x=>(x.name||'').trim()).filter(Boolean);const duplicate=charNames.filter((n,i,a)=>a.findIndex(x=>x.toLowerCase()===n.toLowerCase())!==i);if(duplicate.length)issues.push(`يوجد تكرار في أسماء الشخصيات: ${[...new Set(duplicate)].join('، ')}`);if(!chars.length)issues.push('لا توجد شخصيات بعد.');if(!world.length)issues.push('موسوعة العالم فارغة.');if(!arcs.length)issues.push('لم تُسجل آركات بعد.');if(!chapters.length)issues.push('لم يبدأ أي فصل محفوظ بعد.');if(chapters.some(c=>!(c.desc||'').trim()))issues.push('هناك فصل أو أكثر بلا محتوى.');if(arcs.length&&chapters.length&&!chapters.some(c=>c.arcId||c.arcName))issues.push('الفصول موجودة، لكن لا يوجد فصل مرتبط بآرك بعد.');if(!timeline.length)issues.push('الخط الزمني فارغ؛ قد يكون من المفيد تسجيل الأحداث الكبرى.');if(chars.length&&rels.length===0)issues.push('الشخصيات موجودة دون علاقات مسجلة.');const checks=[chars.length>0,world.length>0,arcs.length>0,chapters.length>0,timeline.length>0,rels.length>0,!duplicate.length,chapters.every(c=>(c.desc||'').trim())];const score=Math.round(checks.filter(Boolean).length/checks.length*100);document.getElementById('score').innerHTML=`<div class="row"><b>جاهزية المشروع</b><strong>${score}%</strong></div><div class="muted">هذه نسبة تنظيمية وليست تقييمًا لجودة الرواية أو السرد.</div>`;document.getElementById('issues').innerHTML=issues.length?issues.map(x=>`<div class="item">⚠️ ${esc(x)}</div>`).join(''):'<div class="item good">✅ لا توجد إشارات بنيوية واضحة تحتاج تدخلك الآن.</div>';const bytes=s=>new Blob([s]).size;const project=JSON.stringify(d),draft=localStorage.getItem(DRAFT)||'',rev=localStorage.getItem(REV)||'',vers=localStorage.getItem(VERS)||'';document.getElementById('storage').innerHTML=`<div class="item"><b>بيانات القصة:</b> ${bytes(project).toLocaleString()} بايت</div><div class="item"><b>المسودة الحالية:</b> ${bytes(draft).toLocaleString()} بايت</div><div class="item"><b>ملاحظات المراجعة:</b> ${bytes(rev).toLocaleString()} بايت</div><div class="item"><b>نسخ المسودات:</b> ${vers?JSON.parse(vers).length:0}</div>`;</script></body></html>
