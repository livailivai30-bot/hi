<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Story Forge — Lore Graph</title></head><body><header class="topbar"><div><div class="eyebrow">LORE GRAPH</div><h1>شبكة المعرفة التفاعلية</h1></div><a class="primary" href="index.html">← غرفة القصة</a></header><main><section class="hero"><div><div class="eyebrow">INTERACTIVE GRAPH</div><h2>اختر أي عنصر لرؤية روابطه.</h2><div class="muted">هذه الصفحة تستخدم علاقات قاعدة القصة نفسها، ولا تنشئ نسخة أخرى من البيانات.</div></div></section><div class="two"><section class="card"><input id="q" class="search" placeholder="فلترة العناصر..."><div id="nodes"></div></section><section class="card"><h3 id="title">اختر عنصرًا</h3><div id="details" class="muted">ستظهر هنا جميع الروابط والعناصر المرتبطة.</div></section></div></main><script src="core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null;function renderNodes(q=''){const rows=StoryForge.all().filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase())).slice(0,250);$('nodes').innerHTML=rows.map(x=>`<button class="nav" data-id="${x.id}">${esc(x.name||x.title)} <span class="pill">${esc(x.label)}</span></button>`).join('')||'<div class="empty">لا توجد عناصر.</div>';document.querySelectorAll('#nodes [data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}function select(id){current=StoryForge.get(id);if(!current)return;$('title').textContent=(current.name||current.title||'بدون اسم')+' · '+current.label;const links=[];StoryForge.all().forEach(x=>{if(x.id===id)return;for(const [k,v] of Object.entries(x)){if(k.endsWith('Id')&&v===id)links.push(`${x.label}: ${x.name||x.title}`);if(k.endsWith('Ids')&&Array.isArray(v)&&v.includes(id))links.push(`${x.label}: ${x.name||x.title}`)}if(x.from===id)links.push(`علاقة → ${x.name||x.title} → ${StoryForge.name(x.to)}`);if(x.to===id)links.push(`علاقة ← ${x.name||x.title} ← ${StoryForge.name(x.from)}`)});$('details').innerHTML=links.length?links.map(x=>`<div class="item">🔗 ${esc(x)}</div>`).join(''):'<div class="item">لا توجد روابط مسجلة بعد.</div>'}$('q').oninput=e=>renderNodes(e.target.value);renderNodes();</script></body></html>
