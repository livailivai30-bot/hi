<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Story Forge — World Bible</title></head><body><header class="topbar"><div><div class="eyebrow">WORLD BIBLE</div><h1>موسوعة العالم</h1></div><a class="primary" href="index.html">← غرفة القصة</a></header><main><section class="hero"><div><div class="eyebrow">WORLD SYSTEM</div><h2>الدول والمدن والفصائل واللغات والاقتصاد والسحر والتاريخ.</h2><div class="muted">يمكن استخدام Lore كقاعدة المعرفة العامة، مع ربط التفاصيل بالفصائل والأماكن والأحداث.</div></div></section><div id="cards" class="grid"></div><section class="card"><h3>تصنيفات Lore</h3><div id="lore"></div></section><section class="card"><h3>الفصائل والحكومات</h3><div id="factions"></div></section><section class="card"><h3>الأماكن والدول والمناطق</h3><div id="locations"></div></section></main><script src="core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cats=['الدولة','المدينة','المنطقة','الحكومة','الدين','الجنس','اللغة','الاقتصاد','التكنولوجيا','السحر','القانون','الأسطورة','التاريخ','الحرب'];$('cards').innerHTML=cats.map(c=>`<div class="card"><span class="muted">${c}</span><div class="stat">${StoryForge.db.lore.filter(x=>(x.category||'')===c).length}</div></div>`).join('');$('lore').innerHTML=StoryForge.db.lore.length?StoryForge.db.lore.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="pill">${esc(x.category||'Lore')}</span><div>${esc(x.description||x.history||'')}</div></div>`).join(''):'<div class="empty">أضف Lore من قسم Lore.</div>';$('factions').innerHTML=StoryForge.db.factions.length?StoryForge.db.factions.map(x=>`<div class="item"><b>${esc(x.name)}</b> · ${esc(x.type||'فصيل')}<div>${esc(x.government||x.religion||x.goals||'')}</div></div>`).join(''):'<div class="empty">لا توجد فصائل.</div>';$('locations').innerHTML=StoryForge.db.locations.length?StoryForge.db.locations.map(x=>`<div class="item"><b>${esc(x.name)}</b> · ${esc(x.type||'مكان')}<div>${esc(x.country||x.region||x.description||'')}</div></div>`).join(''):'<div class="empty">لا توجد أماكن.</div>';</script></body></html>
