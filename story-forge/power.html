<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Story Forge — نظام القوى</title></head><body><header class="topbar"><div><div class="eyebrow">POWER SYSTEM</div><h1>متتبع القدرات والقواعد</h1></div><a class="primary" href="index.html">← غرفة القصة</a></header><main><section class="hero"><div><div class="eyebrow">ABILITY TRACKER</div><h2>Ability → User → Source → Cost → Limitation → Evolution → Counter</h2><div class="muted">وسجل استخدام حقيقي لكل قدرة لاكتشاف المخالفات عبر الفصول.</div></div></section><section class="card editor"><div class="two"><label>القدرة<select id="ability"></select></label><label>الفصل<input id="chapter" type="number"></label></div><div class="two"><label>طريقة الاستخدام<textarea id="method"></textarea></label><label>التكلفة المدفوعة<textarea id="costPaid"></textarea></label></div><div class="two"><label>مخالفة القاعدة؟<select id="violation"><option value="false">لا</option><option value="true">نعم</option></select></label><label>ملاحظات<textarea id="notes"></textarea></label></div><button id="save" class="save">تسجيل الاستخدام</button></section><section class="card"><div class="row"><b>سجل القدرات</b><button id="refresh" class="ghost">تحديث</button></div><div id="list"></div></section></main><script src="core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fill(){const a=$('ability');a.innerHTML='<option value="">اختر القدرة...</option>'+StoryForge.db.abilities.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');}function render(){fill();$('list').innerHTML=StoryForge.db.abilities.flatMap(a=>(a.uses||[]).map((u,i)=>({a,u,i}))).reverse().map(x=>{const warn=String(x.u.violation)==='true'||(x.a.cost&&!(x.u.costPaid||'').trim());return `<div class="item"><b>${esc(x.a.name)}</b> · الفصل ${esc(x.u.chapter||'—')} ${warn?'⛔':''}<div class="muted">${esc(x.u.method||'')}</div><div>${warn?'<b>مخالفة محتملة: راجع تكلفة/قاعدة القدرة.</b>':''} ${esc(x.u.notes||'')}</div></div>`}).join('')||'<div class="empty">لا توجد استخدامات مسجلة بعد.</div>'}function save(){const id=$('ability').value;if(!id)return alert('اختر قدرة.');const a=StoryForge.get(id);a.uses=Array.isArray(a.uses)?a.uses:[];a.uses.push({chapter:Number($('chapter').value)||null,method:$('method').value,costPaid:$('costPaid').value,violation:$('violation').value,notes:$('notes').value,createdAt:new Date().toISOString()});StoryForge.update('abilities',id,{uses:a.uses});['chapter','method','costPaid','notes'].forEach(k=>$(k).value='');render();alert('تم تسجيل الاستخدام.')}$('save').onclick=save;$('refresh').onclick=render;render();</script></body></html>
