<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Story Forge — Story Analytics</title></head><body><header class="topbar"><div><div class="eyebrow">STORY ANALYTICS</div><h1>تحليلات القصة</h1></div><a class="primary" href="index.html">← غرفة القصة</a></header><main><section class="hero"><div><div class="eyebrow">DEEP ANALYTICS</div><h2>اعرف أين تتنفس القصة وأين تتعطل.</h2><div class="muted">تحليلات تشغيلية للنص الطويل، وليست حكمًا أدبيًا نهائيًا.</div></div></section><div id="metrics" class="grid"></div><div class="grid"><section class="card"><h3>ظهور الشخصيات وآخر ظهور</h3><div id="chars"></div></section><section class="card"><h3>توزيع الفصول على الآركات</h3><div id="arcs"></div></section></div><div class="grid"><section class="card"><h3>كثافة الأحداث</h3><div id="pacing"></div></section><section class="card"><h3>عناصر غير مستعملة</h3><div id="unused"></div></section></div><section class="card"><h3>الأسرار والتلميحات</h3><div id="mysteries"></div></section><section class="card"><h3>الاستمرارية</h3><div id="continuity"></div></section></main><script src="core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ch=[...StoryForge.db.chapters].sort((a,b)=>(Number(a.number)||999999)-(Number(b.number)||999999));const ev=StoryForge.db.events;const counts={};ch.forEach((c,i)=>{(c.characterIds||[]).forEach(id=>counts[id]=(counts[id]||0)+1);if(c.text)counts[c._wordCount]=counts[c._wordCount]||0});const totalWords=ch.reduce((n,c)=>n+(String(c.text||c.desc||'').trim().split(/\s+/).filter(Boolean).length),0);const openM=StoryForge.db.mysteries.filter(x=>!/^solved$/i.test(x.status||''));const openF=StoryForge.db.foreshadows.filter(x=>!/^resolved$/i.test(x.status||'')&&!(x.payoff||'').trim());const issues=StoryForge.continuity();$('metrics').innerHTML=[['الفصول',ch.length],['إجمالي الكلمات',totalWords],['الأحداث',ev.length],['أسرار مفتوحة',openM.length],['تلميحات بلا Payoff',openF.length],['مشاكل الاستمرارية',issues.length]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><div class="stat">${x[1]}</div></div>`).join('');$('chars').innerHTML=StoryForge.db.characters.map(c=>{let nums=ch.map((x,i)=>(x.characterIds||[]).includes(c.id)?i+1:0).filter(Boolean);return `<div class="item"><b>${esc(c.name)}</b> · ${nums.length} ظهور · آخر ظهور: ${nums.length?nums[nums.length-1]:'لا يوجد'}</div>`}).join('')||'<div class="empty">لا توجد شخصيات.</div>';$('arcs').innerHTML=StoryForge.db.arcs.map(a=>`<div class="item"><b>${esc(a.name)}</b> · ${ch.filter(c=>c.arcId===a.id).length} فصل</div>`).join('')||'<div class="empty">لا توجد آركات.</div>';$('pacing').innerHTML=ch.map(c=>{const n=ev.filter(e=>e.chapterId===c.id||e.chapter===c.number).length;return `<div class="item"><b>ف${esc(c.number||'—')} — ${esc(c.name)}</b> · ${n} حدث · ${String(c.text||c.desc||'').trim().split(/\s+/).filter(Boolean).length} كلمة</div>`}).join('')||'<div class="empty">لا توجد فصول.</div>';const usedF=new Set();StoryForge.db.relationships.forEach(r=>{if(r.from)usedF.add(r.from);if(r.to)usedF.add(r.to)});const unusedF=StoryForge.db.factions.filter(f=>!StoryForge.db.relationships.some(r=>r.from===f.id||r.to===f.id));const unusedC=StoryForge.db.characters.filter(c=>!ch.some(x=>(x.characterIds||[]).includes(c.id)));$('unused').innerHTML=[...unusedC.map(x=>`<div class="item">👤 ${esc(x.name)} — شخصية بلا ظهور في الفصول المربوطة.</div>`),...unusedF.map(x=>`<div class="item">🏛️ ${esc(x.name)} — فصيل بلا علاقة مسجلة.</div>`)].join('')||'<div class="item good">✅ لا توجد عناصر واضحة غير مستعملة.</div>';$('mysteries').innerHTML=[...openM.map(x=>`<div class="item">❓ ${esc(x.name)} — ${esc(x.status||'Open')}</div>`),...openF.map(x=>`<div class="item">🧵 ${esc(x.name)} — بلا Payoff</div>`)].join('')||'<div class="item good">✅ لا توجد أسرار أو تلميحات مفتوحة.</div>';$('continuity').innerHTML=issues.length?issues.map(x=>`<div class="item">${x.level==='error'?'⛔':'⚠️'} ${esc(x.message)}</div>`).join(''):'<div class="item good">✅ لا توجد مشكلات.</div>';</script></body></html>
