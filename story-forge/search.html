<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><title>Story Forge — البحث الشامل</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">STORY FORGE · SEARCH</div><h1>البحث الشامل</h1></div><div class="actions"><a class="ghost" href="health.html">صحة المشروع</a><a class="primary" href="index.html">← غرفة القصة</a></div></header><main><section class="hero"><div><div class="eyebrow">GLOBAL SEARCH</div><h2>ابحث في عالمك كله.</h2><div class="muted">الشخصيات، العالم، الآركات، الفصول، الأحداث، العلاقات والملاحظات.</div></div></section><section class="card"><input id="q" class="search" autofocus placeholder="اكتب اسمًا، كلمة، حدثًا، مكانًا..."><div class="row" style="margin-top:10px"><span id="count" class="muted">0 نتيجة</span><button id="clear" class="ghost">مسح</button></div></section><section id="results"></section></main><script>const KEY='story-forge-v3';const d=JSON.parse(localStorage.getItem(KEY)||'null')||{};const map={characters:'الشخصيات',world:'العالم',arcs:'الآركات',chapters:'الفصول',timeline:'الأحداث',relationships:'العلاقات',notes:'الملاحظات'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const all=[];Object.entries(map).forEach(([k,label])=>(Array.isArray(d[k])?d[k]:[]).forEach((x,i)=>{all.push({type:label,key:k,index:i,name:x.name||x.title||x.label||'بدون اسم',text:[x.name,x.title,x.desc,x.text,x.summary,x.meta,x.role,x.status,x.location,x.tag].filter(Boolean).join(' ')}); }));const q=document.getElementById('q'),r=document.getElementById('results'),count=document.getElementById('count');function render(){const term=q.value.trim().toLocaleLowerCase('ar');const rows=term?all.filter(x=>x.text.toLocaleLowerCase('ar').includes(term)).slice(0,100):[];count.textContent=`${rows.length} نتيجة`;r.innerHTML=rows.length?rows.map(x=>`<article class="card" style="margin-top:10px"><div class="row"><b>${esc(x.name)}</b><span class="pill">${esc(x.type)}</span></div><div class="muted">${esc(x.text.slice(0,320))}</div></article>`).join(''):'<div class="card" style="margin-top:10px"><div class="empty">ابدأ بكتابة كلمة للبحث في مشروعك.</div></div>'}q.oninput=render;document.getElementById('clear').onclick=()=>{q.value='';q.focus();render()};render();</script></body></html>
