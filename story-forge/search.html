<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><title>Story Forge — البحث الشامل</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">STORY FORGE · SEARCH</div><h1>البحث الشامل</h1></div><div class="actions"><a class="ghost" href="health.html">صحة المشروع</a><a class="primary" href="index.html">← غرفة القصة</a></div></header><main><section class="hero"><div><div class="eyebrow">GLOBAL SEARCH</div><h2>ابحث في كل قاعدة القصة.</h2><div class="muted">Characters · World · Lore · Arcs · Chapters · Events · Secrets · Abilities · Timeline.</div></div></section><section class="card"><input id="q" class="search" autofocus placeholder="شخصية، مكان، فصل، سر، قدرة، حدث..."><div class="row" style="margin-top:10px"><span id="count" class="muted">0 نتيجة</span><button id="clear" class="ghost">مسح</button></div></section><section id="results"></section></main><script src="core.js"></script><script>const q=document.getElementById('q'),r=document.getElementById('results'),count=document.getElementById('count'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const rows=StoryForge.search(q.value);count.textContent=`${rows.length} نتيجة`;r.innerHTML=q.value.trim()?rows.map(x=>`<article class="card" style="margin-top:10px"><div class="row"><b>${esc(x.name||x.title)}</b><span class="pill">${esc(x.label)}</span></div><div class="muted">${esc(x.description||x.desc||x.text||x.goal||x.category||x.status||'')}</div></article>`).join('')||'<div class="card" style="margin-top:10px"><div class="empty">لا توجد نتائج.</div></div>':'<div class="card" style="margin-top:10px"><div class="empty">ابدأ بكتابة كلمة للبحث.</div></div>'}q.oninput=render;document.getElementById('
