<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Story Forge — Timeline Engine</title></head><body><header class="topbar"><div><div class="eyebrow">TIMELINE ENGINE</div><h1>المحرك الزمني</h1></div><a class="primary" href="index.html">← غرفة القصة</a></header><main><section class="hero"><div><div class="eyebrow">CHRONOLOGY</div><h2>الزمن، الأعمار، الحالات والمواقع في مكان واحد.</h2><div class="muted">يدعم الأحداث السرية، Flashback، Flash-forward، والأحداث المستقبلية.</div></div></section><section class="card"><div class="two"><label>الشخصية<select id="character"></select></label><label>السنة للتحقق<input id="year" type="number" placeholder="مثال: 120"></label></div><button id="check" class="save">تحقق من الحالة</button><div id="result" class="item muted"></div></section><section class="card"><h3>التسلسل الزمني</h3><div id="timeline"></div></section></main><script src="core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fill(){const c=$('character');c.innerHTML='<option value="">اختر شخصية...</option>'+StoryForge.db.characters.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}function check(){const id=$('character').value,y=Number($('year').value);if(!id||!y)return $('result').textContent='اختر شخصية وسنة.';const c=StoryForge.get(id),age=StoryForge.characterAge(id,y);const states=StoryForge.db.states.filter(s=>s.characterId===id&&s.chapter!=null).sort((a,b)=>(a.chapter||0)-(b.chapter||0));const nearest=states.length?states[states.length-1]:null;$('result').innerHTML=`العمر المحسوب: <b>${age??'غير متاح'}</b> · آخر حالة مسجلة: <b>${esc(nearest?.status||'لا توجد')}</b> · الموقع: <b>${esc(StoryForge.name(nearest?.locationId)||'غير معروف')}</b>`}function render(){fill();const a=StoryForge.timelineSorted();$('timeline').innerHTML=a.length?a.map(e=>`<div class="item"><b>${esc(e.name)}</b> · ${esc(e.year??'—')}/${esc(e.month??'—')}/${esc(e.day??'—')} <span class="pill">${esc(e.type||'event')}</span>${e.secret?' 🔒':''}<div class="muted">${esc(e.description||'')}</div>${e.characterId?`<small>الشخصية: ${esc(StoryForge.name(e.characterId))} · العمر: ${esc(StoryForge.characterAge(e.characterId,e.year))}</small>`:''}</div>`).join(''):'<div class="empty">لا توجد أحداث زمنية.</div>'}$('character').onchange=check}$('check').onclick=check;render();</script></body></html>
